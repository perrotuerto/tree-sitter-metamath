[build-system]
requires = ["setuptools>=70.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-metamath"
description = "A simple and flexible computer-processable language that supports rigorously verifying, archiving, and presenting mathematical proofs."
version = "0.1.1"
keywords = ["incremental", "parsing", "tree-sitter", "metamath"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Ramiro Santa Ana Anguiano", email = "hi@colima.press" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Repository = "https://gitlab.com/perritotuerto/codigo/metamath/tree-sitter-metamath"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
